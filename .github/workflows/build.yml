# プッシュとプルリクエストのたびに、単体テストとビルドが通るかを確かめる
name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # compileSdk 37(Android 17)の SDK は、GitHub の実行環境にまだ入っていないので入れる
      # (配られている名前は platforms;android-37.0 など。AGP は platforms/android-37 を探すので、その名前でも置く。Termux と同じ)
      - name: Install Android SDK platform 37
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          d="$ANDROID_HOME/platforms"
          if [ ! -d "$d/android-37" ]; then
            pkg=$("$sdk" --list 2>/dev/null | grep -o 'platforms;android-37[^ |]*' | sort -u | head -1)
            [ -n "$pkg" ] || { echo "platforms;android-37 is not available"; exit 1; }
            echo "installing $pkg"
            yes | "$sdk" --install "$pkg" > /dev/null
            name=${pkg#platforms;}
            if [ "$name" != "android-37" ]; then
              cp -r "$d/$name" "$d/android-37"
              sed -i "s#platforms;$name#platforms;android-37#" "$d/android-37/package.xml"
            fi
          fi
          ls "$d"

      # Gradle のキャッシュと、gradle-wrapper.jar が正規のものかの確認
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UCRT-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            legacy/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14
