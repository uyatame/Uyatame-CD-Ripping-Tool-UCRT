org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Android 17(API 37)の SDK でビルドする。使っている Android Gradle Plugin(8.9)が正式には 36 までなので、その警告を止める
android.suppressUnsupportedCompileSdk=37
# Termux(arm64)でビルドする場合は、このファイルではなく ~/.gradle/gradle.properties に
#   android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
# を書いてください(このファイルは Git で公開されるため)。
